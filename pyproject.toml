[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow"
version = "0.1.0"
description = "Deterministic verification for agents that write code"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AegisFlow contributors" }]
keywords = [
  "langgraph", "agents", "verification", "guardrails", "testing",
  "assertions", "code-review", "static-analysis", "ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

# The verification core has NO runtime dependencies, by policy: it must stay
# embeddable without version conflicts, and must never reach the network.
# See RULES.md sections 3 and 4.
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]

[project.urls]
Homepage = "https://github.com/tensilestream/AgeisFlow"
Repository = "https://github.com/tensilestream/AgeisFlow"
Changelog = "https://github.com/tensilestream/AgeisFlow/blob/main/CHANGELOG.md"
Issues = "https://github.com/tensilestream/AgeisFlow/issues"

[project.scripts]
aegisflow = "aegisflow.cli:main"

[tool.setuptools.packages.find]
include = ["aegisflow*"]

[tool.setuptools.package-data]
aegisflow = ["py.typed"]
