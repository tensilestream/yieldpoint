[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yieldpoint"
version = "0.1.6"
description = "Deterministic verification for agents that write code"
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
license-files = ["LICENSE", "NOTICE", "TRADEMARK.md", "COMMERCIAL.md"]
authors = [{ name = "Yieldpoint contributors" }]
keywords = [
  "ai-agents", "coding-agents", "claude-code", "cursor", "copilot",
  "mcp", "model-context-protocol", "guardrails", "evals",
  "langgraph", "crewai", "verification", "code-review",
  "static-analysis", "software-testing", "assertions", "developer-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

# The verification core has NO runtime dependencies, by policy: it must stay
# embeddable without version conflicts, and must never reach the network.
# See RULES.md sections 3 and 4.
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
# TypeScript and JavaScript structural analysis. Optional on purpose: the
# core takes no dependencies, so without these those files stay reported as
# not evaluated — never as clean. Depth is opt-in; silence is not.
typescript = ["tree-sitter>=0.23", "tree-sitter-typescript>=0.23"]
# A real token counter, for repositories that set metrics.tokenizer. Without
# it every token figure is a 4-chars-per-token estimate and is labelled one.
# Deliberately not a runtime dependency: loading an encoding may fetch its
# vocabulary, and the core must never reach the network (RULES.md section 4).
tokenizer = ["tiktoken>=0.7"]

[project.urls]
Homepage = "https://github.com/tensilestream/yieldpoint"
Documentation = "https://tensilestream.github.io/yieldpoint/"
Repository = "https://github.com/tensilestream/yieldpoint"
Changelog = "https://github.com/tensilestream/yieldpoint/blob/main/CHANGELOG.md"
Issues = "https://github.com/tensilestream/yieldpoint/issues"

[project.scripts]
yieldpoint = "yieldpoint.cli:main"
yp = "yieldpoint.cli:main"

[tool.setuptools.packages.find]
include = ["yieldpoint*"]

[tool.setuptools.package-data]
yieldpoint = ["py.typed"]
