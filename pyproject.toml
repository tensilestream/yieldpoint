[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow"
version = "0.1.0"
description = "Deterministic verification layer for agents that write code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["langgraph", "agents", "verification", "guardrails", "testing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

# The verification core has NO runtime dependencies, by policy. See RULES.md section 3.
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]

[project.scripts]
aegisflow = "aegisflow.cli:main"

[tool.setuptools.packages.find]
include = ["aegisflow*"]
