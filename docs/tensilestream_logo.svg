<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141f24" />
      <stop offset="100%" stop-color="#0a0f12" />
    </radialGradient>
    <linearGradient id="stream-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f6d78" />
      <stop offset="50%" stop-color="#6fb3bf" />
      <stop offset="100%" stop-color="#9fe0eb" />
    </linearGradient>
    <linearGradient id="stream-amber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#934c14" />
      <stop offset="50%" stop-color="#dd9155" />
      <stop offset="100%" stop-color="#ffb877" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#223038" stroke-width="3"/>

  <!-- Subtle structural grid lines -->
  <g opacity="0.12" stroke="#6fb3bf" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <circle cx="256" cy="256" r="160" fill="none" />
  </g>

  <!-- Tensile Arch Structure (Cyan Stream) -->
  <path d="M 120 370 C 145 230, 205 150, 290 150 C 350 150, 395 210, 400 370" 
        fill="none" 
        stroke="url(#stream-cyan)" 
        stroke-width="26" 
        stroke-linecap="round" 
        filter="url(#glow)"/>

  <!-- Tensile Cross-Tension Stream (Amber Ribbon) -->
  <path d="M 110 350 C 170 330, 240 280, 280 200 C 315 130, 390 135, 420 150" 
        fill="none" 
        stroke="url(#stream-amber)" 
        stroke-width="20" 
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Dynamic Yield Point Coordinate Dot -->
  <circle cx="280" cy="200" r="13" fill="#ffffff" stroke="#dd9155" stroke-width="5" filter="url(#glow)"/>

  <!-- Structural cross tie / tension line -->
  <path d="M 195 260 L 335 340" 
        stroke="#6fb3bf" 
        stroke-width="8" 
        stroke-linecap="round" 
        opacity="0.75" />
</svg>
