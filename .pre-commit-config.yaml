# Install:  pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: yieldpoint
        name: Yieldpoint (verify staged changes)
        entry: yieldpoint review --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        # `review --staged` asks git for the staged diff. Do not use
        # `check --diff -` here: pre-commit gives a hook no stdin, so it reads
        # an empty diff and reports `ok` on everything.
        verbose: true

      - id: tests
        name: unit tests
        entry: python -m unittest discover -s tests -t . -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
