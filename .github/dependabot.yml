version: 2
updates:
  # The package itself has no runtime dependencies by policy, so this watches
  # the CI actions — which are the only third-party code in the build path.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "deps" }
