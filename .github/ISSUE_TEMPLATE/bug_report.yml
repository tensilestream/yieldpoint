name: Bug report
description: Something else is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Exact commands, please.
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version and Python
      placeholder: "yieldpoint 0.1.0, Python 3.12, macOS"
    validations: { required: true }
