<svg xmlns='http://www.w3.org/2000/svg' width='880' height='340' viewBox='0 0 880 340' role='img' aria-label='Yieldpoint benchmark scorecard'><rect width='880' height='340' rx='12' fill='#ffffff'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#1a1d23'>Yieldpoint &#8212; measured, not asserted</text><text x='24' y='56' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#636b78'>Deterministic verification for coding agents. No model call, same answer every run.</text><rect x='24' y='78' width='266' height='236' rx='10' fill='#f7f8fa' stroke='#dde2ea'/><text x='42' y='108' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1a1d23'>real commits</text><text x='42' y='126' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#636b78'>this repository's own history</text><text x='42' y='156' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#636b78'>commits replayed</text><text x='272' y='156' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size='13' font-weight='600' fill='#1a1d23'>44</text><text x='42' y='192' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#636b78'>would have been stopped</text><text x='272' y='192' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size='13' font-weight='600' fill='#a8642a'>7</text><text x='42' y='228' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#636b78'>time</text><text x='272' y='228' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size='13' font-weight='600' fill='#1a1d23'>5.5s</text><text x='42' y='26